<!DOCTYPE html>
<html>
<head>
    <title>M-Pesa Payment</title>
</head>
<body>
    <h2>Pay with M-Pesa</h2>
    <input type="text" id="phone" placeholder="2547XXXXXXXX" value="254">
    <input type="number" id="amount" placeholder="Amount" value="1">
    <button onclick="payNow()">Pay Now</button>
    
    <p id="status"></p>

    <script>
        async function payNow() {
            const phone = document.getElementById('phone').value;
            const amount = document.getElementById('amount').value;
            const statusParams = document.getElementById('status');
            
            statusParams.innerText = "Processing...";

            try {
                const response = await fetch('http://127.0.0.1:5000/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone, amount: amount })
                });
                
                const data = await response.json();
                console.log(data);
                
                if(data.ResponseCode === "0") {
                    statusParams.innerText = "Check your phone for the PIN prompt!";
                } else {
                    statusParams.innerText = "Error: " + data.errorMessage;
                }
            } catch (error) {
                console.error(error);
                statusParams.innerText = "Failed to connect to server.";
            }
        }
    </script>
</body>
</html>
